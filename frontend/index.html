<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rural Hospital AI Agent</title>

    <link rel="stylesheet" href="./style.css?v=20261026-quality-rag">
</head>

<body>

<div class="app-container">

    <!-- Application identity and supported investigation scope. -->
    <header>
        <h1>Rural Hospital AI Agent</h1>
        <p>
            Investigate hospital finances, trends and healthcare access
            using public CMS, Census and HRSA data.
        </p>
    </header>

    <main>
        <!-- Successful tool results update this single/pair identity banner. -->
        <div id="current-facility" class="current-facility" hidden aria-live="polite"></div>

        <!-- Answers and temporary progress appear here; state is held in app.js. -->
        <div id="chat-box" class="chat-box">

            <div class="message agent-message">
                <div class="message-label">
                    AI Agent
                </div>

                <div class="message-content">Ask about a hospital by name, state and county, or use its CMS CCN. Request a full investigation or focus on finances, trends or healthcare access.</div>
            </div>

        </div>


        <!-- Examples fill the input; Clear chat resets identity and history. -->
        <div class="examples">
            <button class="example-button" onclick="useExample('Investigate Mile Bluff Medical Center in Juneau County, Wisconsin. Include financials, trends, healthcare access and data gaps.')">Full hospital investigation</button>
            <button class="example-button" onclick="useExample('Find Reedsburg Area Medical Center in Sauk County, WI.')">Find by name &amp; location</button>
            <button class="example-button" onclick="useExample('Analyze its financial distress.')">Financial follow-up</button>
            <button class="example-button" onclick="useExample('Compare Mile Bluff Medical Center in Juneau County, Wisconsin, and Reedsburg Area Medical Center in Sauk County, Wisconsin. Include financial condition and healthcare access.')">Compare two hospitals</button>
            <button class="example-button" onclick="useExample('Which Wisconsin facilities are listed in the historical CMS/IHS tribal directory? Include facility types, listed CCNs, source date and pages.')">Historical tribal directory</button>
            <button class="example-button" onclick="useExample('Analyze healthcare access around rural hospitals across Wyoming. Report rural classification year, coverage and missing data.')">State rural access</button>
            <button class="example-button" onclick="useExample('Analyze healthcare access around rural hospitals in Fremont County, Wyoming. Include county context and nearby same-state hospitals.')">County rural access</button>
            <button class="example-button" onclick="useExample('Analyze healthcare access around all CMS-listed hospitals in ZIP code 53948, Wisconsin. Distinguish county-level context from ZIP-level evidence.')">ZIP hospital access</button>
            <button class="example-button" onclick="useExample('Explain the difference between a geographic HPSA and a population HPSA. Cite the methodology documents.')">Explain data &amp; methods</button>
            <button class="example-button clear-button" onclick="clearChat()">Clear chat</button>
        </div>

        <!-- Disable submission while a streamed request is still running. -->
        <div class="input-area">

            <textarea
                id="message-input"
                placeholder="Hospital name, state/county, or a follow-up question…" aria-label="Message to hospital agent"
                rows="2"
            ></textarea>

            <button
                id="send-button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </main>

</div>

<!-- Load the safe renderer before the chat controller. -->
<script src="markdown.js?v=20261016-tribal-directory"></script>
<script src="app.js?v=20261026-quality-rag"></script>

</body>
</html>
